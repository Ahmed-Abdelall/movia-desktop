name: Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build windows --release
      - name: Install Inno Setup
        if: startsWith(github.ref, 'refs/tags/v')
        run: choco install innosetup --no-progress -y
      - name: Build tagged artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          iscc installer/movia-desktop.iss
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath release/Movia-Desktop-1.1.0-portable.zip
          (Get-FileHash release/Movia-Desktop-Setup-1.1.0.exe -Algorithm SHA256).Hash.ToLower() + '  Movia-Desktop-Setup-1.1.0.exe' | Set-Content release/Movia-Desktop-Setup-1.1.0.exe.sha256
          (Get-FileHash release/Movia-Desktop-1.1.0-portable.zip -Algorithm SHA256).Hash.ToLower() + '  Movia-Desktop-1.1.0-portable.zip' | Set-Content release/Movia-Desktop-1.1.0-portable.zip.sha256
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: movia-desktop-${{ github.ref_name }}
          path: release/*
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          draft: false
          name: Movia Desktop v1.1.0
          body_path: RELEASE_NOTES.md
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
